# fedora-hypr: draw the menu with GRUB's own gfxterm (the Framework's EFI text console
# repaints line by line and blocks key input meanwhile) and hide it unless Esc is held.
if loadfont ${prefix}/fonts/unicode.pf2; then
  set gfxmode=auto
  insmod gfxterm
  terminal_output gfxterm
fi
set timeout_style=hidden
set timeout=2
