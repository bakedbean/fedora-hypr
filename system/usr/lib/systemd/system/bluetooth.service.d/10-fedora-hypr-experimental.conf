# tether's notification mirroring (ANCS) needs BlueZ's experimental bearer API
# (org.bluez.Bearer.LE1), and it must be on *before* the iPhone is paired: a bond
# made without it has no LE half. Same drop-in `tether bt setup` prints.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --experimental
