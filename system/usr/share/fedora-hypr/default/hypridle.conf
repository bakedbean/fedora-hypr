general {
    lock_cmd = fh-system-lock                         # lock screen and 1password
    before_sleep_cmd = FH_LOCK_ONLY=true fh-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && fh-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Lock system after 5 minutes
listener {
    timeout = 300
    on-timeout = fh-system-lock
    on-resume = fh-system-wake
}
