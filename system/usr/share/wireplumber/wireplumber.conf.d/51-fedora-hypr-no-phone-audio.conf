# Keep the iPhone's audio on the phone (tether, docs/BLUETOOTH.md "Keeping the phone's
# audio on the phone"): advertise only the roles headphones use (playback, headset mic,
# LE Audio playback), not the sink/hands-free roles that make this machine a speaker
# for a phone. Leaving out hfp_hf hands the hands-free profile to BlueZ, which is
# where tether's call control and the carrier/signal/battery indicators come from.
# Override per user in ~/.config/wireplumber/wireplumber.conf.d/ (one file setting
# bluez5.roles wins; keep only one).
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source bap_source hfp_ag ]
}
