# App launchers — edit freely.
# Plain SUPER+<letter> is reserved for window management (see
# /usr/share/fedora-hypr/default/hypr/bindings/tiling-v2.conf); apps live on
# SUPER SHIFT so they never collide with it.
$terminal = uwsm-app -- alacritty
$browser = fh-launch-browser
$fileManager = uwsm-app -- nautilus --new-window

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(fh-cmd-terminal-cwd)"
bindd = SUPER, B, Firefox, exec, uwsm-app -- firefox

bindd = SUPER SHIFT, RETURN, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT, F, File manager, exec, $fileManager
bindd = SUPER SHIFT, M, Music, exec, fh-launch-or-focus spotify "uwsm-app -- flatpak run com.spotify.Client"
bindd = SUPER SHIFT, N, Editor, exec, fh-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, fh-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, fh-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, fh-launch-or-focus signal "uwsm-app -- flatpak run org.signal.Signal"
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- flatpak run com.onepassword.OnePassword
