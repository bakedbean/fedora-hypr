name: build
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  schedule:
    - cron: '30 5 * * 0'   # weekly; push to main builds immediately; `gh workflow run build` on demand
  workflow_dispatch:

permissions:
  contents: write     # weekly run commits the re-pinned base digests
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CACHE: ghcr.io/${{ github.repository }}-cache
  # A push rebuilds only what changed, from the registry layer cache. The weekly run (and a
  # manual dispatch) re-pins the base images to their current digests and builds from scratch,
  # so package updates land even though the cache would happily serve last week's layers.
  FRESH: ${{ github.event_name != 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive tag from Containerfile
        run: |
          echo "TAG=$(sed -n 's#^FROM ghcr.io/ublue-os/base-main:\([0-9]*\).*#\1#p' Containerfile)" >> "$GITHUB_ENV"
          echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"
      - name: Host-side test of tools/migrate-home.sh
        run: |
          for t in rsync jq perl shellcheck zsh; do command -v "$t" >/dev/null || missing="$missing $t"; done
          if [ -n "${missing:-}" ]; then sudo apt-get update -q && sudo apt-get install -y -q $missing; fi
          make test-migrate
      - name: Login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Re-pin base images to current digests
        if: env.FRESH == 'true'
        run: tools/bump-base.sh
      - name: Build
        run: |
          # Diagnostics for a failed build: the runner's free disk (the image is ~10 GB, the rust
          # stage ~3 GB; ubuntu-latest has ~20 GB) and the buildah that did the cache handling.
          df -h / && sudo podman version
          if [ "$FRESH" = true ]; then from=(); else from=(--cache-from "$CACHE"); fi
          sudo podman build --layers "${from[@]}" --cache-to "$CACHE" \
            -t "$IMAGE:$TAG" -t "$IMAGE:$TAG-$DATE" .
      - name: Self-check
        run: sudo podman run --rm -v ./tests:/tests:ro "$IMAGE:$TAG" bash /tests/check.sh
      - name: Push
        run: |
          sudo podman push "$IMAGE:$TAG"
          sudo podman push "$IMAGE:$TAG-$DATE"
      # Only after the image built, passed and is published: main must never point at a
      # digest that did not build. A push by GITHUB_TOKEN does not trigger this workflow again.
      - name: Commit re-pinned base digests
        if: env.FRESH == 'true'
        run: |
          git diff --quiet -- Containerfile && { echo "bases unchanged"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: re-pin base images to current digests" -- Containerfile
          git push
