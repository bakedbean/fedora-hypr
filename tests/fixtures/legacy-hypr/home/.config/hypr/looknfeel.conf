# Change the default fedora-hypr look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    gaps_in = 2
    gaps_out = 2
    border_size = 0

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# Scrolling layout configuration
scrolling:column_width = 1.0  # Full screen width per window

# --- fixture: shapes from a real account
windowrule = opacity 0.90 0.80, match:tag default-opacity
windowrule = opacity 0.90 0.80, match:tag terminal
decoration {
    rounding = 4
    blur {
        passes = 3
    }
}
general:col.active_border = $activeBorderColor
group:col.border_active = rgba(ff0000ee) rgba(00ff00ee) 90deg
animations {
    bezier = myCurve, 0.1, 0.9, 0.2, 1.0
    animation = windows, 1, 4, myCurve, slide
    animation = workspaces, 0
}
# --- fixture: rejected by Hyprland, so the migration must comment it out
general {
    no_such_option = 1
}
