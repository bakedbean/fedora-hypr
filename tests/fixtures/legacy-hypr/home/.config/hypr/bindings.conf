# App launchers — edit freely.
# Plain SUPER+<letter> is reserved for window management (see
# /usr/share/fedora-hypr/default/hypr/bindings/tiling-v2.conf); apps live on
# SUPER SHIFT so they never collide with it.
$terminal = uwsm-app -- alacritty
$browser = fh-launch-browser
$fileManager = uwsm-app -- nautilus --new-window

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(fh-cmd-terminal-cwd)"
bindd = SUPER, B, Firefox, exec, uwsm-app -- firefox

bindd = SUPER SHIFT, RETURN, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT, F, File manager, exec, $fileManager
bindd = SUPER SHIFT, M, Music, exec, fh-launch-or-focus spotify "uwsm-app -- flatpak run com.spotify.Client"
bindd = SUPER SHIFT, N, Editor, exec, fh-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, fh-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, fh-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, fh-launch-or-focus signal "uwsm-app -- flatpak run org.signal.Signal"
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- flatpak run com.onepassword.OnePassword

# --- fixture: shapes from a real account
$terminal = uwsm-app -- xdg-terminal-exec
bindd = SUPER ALT, RETURN, Tmux, exec, $terminal --dir="$(fh-cmd-terminal-cwd)" tmux new
bindd = SUPER SHIFT, R, RadioBar play/pause, exec, radiobar toggle
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, fh-launch-webapp "https://example.com/##frag"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, fh-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
unbind = SUPER, SPACE
bindd = SUPER, SPACE, fedora-hypr menu, exec, fh-menu
bind = SUPER CTRL, M, movetoworkspace, special:music
bindm = SUPER ALT, mouse:272, resizewindow
binde = SUPER CTRL, code:20, resizeactive, -10 0
# --- fixture: edge cases that must become FIXME comments, not broken Lua
bind = SUPER CTRL, Y, pass, class:^(obs)$
bindd = SUPER CTRL, U, Unknown thing, someunknowndispatcher, 1
source = ~/.config/hypr/extra.conf
# a submap: none of its binds may become global
submap = resize
binde = , H, resizeactive, -10 0
bind = , escape, submap, reset
submap = reset
bindd = SUPER CTRL, J, After the submap, exec, after-submap
