# A user file pulled in with `source` from another user file
windowrule = match:class ^(org.example.app)$, float on, size 800 600
layerrule = blur on, match:namespace waybar
workspace = 5, layout:scrolling
# pre-0.53 syntax (themes made for the old config use it)
windowrulev2 = bordercolor 0xffeb6f92,fullscreen:1
windowrulev2 = float, class:^(pavucontrol)$, title:^(Volume, Control)$
